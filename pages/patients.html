<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NEOCARE Patients — Manage and monitor patient records." />
    <title>NEOCARE | Patients</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/shell.css" />
    <link rel="stylesheet" href="../css/patients.css" />
  </head>
  <body>

    <!-- Mobile backdrop -->
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <div class="app-shell">

      <!-- ======== SIDEBAR ======== -->
      <aside
        class="sidebar"
        id="app-sidebar"
        aria-label="Main navigation"
      >
        <!-- Branding -->
        <a class="sidebar-brand" href="dashboard.html" aria-label="NEOCARE home">
          <span class="sidebar-brand-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                 stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </span>
          <span class="sidebar-brand-text">
            <span class="sidebar-brand-name">NEOCARE</span>
            <span class="sidebar-brand-sub">Doctor Dashboard</span>
          </span>
        </a>

        <!-- Navigation -->
        <nav class="sidebar-nav" aria-label="Application navigation">
          <span class="nav-section-label">Main</span>

          <a class="nav-item" href="dashboard.html" data-page="dashboard" data-label="Dashboard">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </span>
            <span class="nav-label">Dashboard</span>
          </a>

          <a class="nav-item" href="patients.html" data-page="patients" data-label="Patients">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </span>
            <span class="nav-label">Patients</span>
          </a>

          <a class="nav-item" href="monitoring.html" data-page="monitoring" data-label="Monitoring">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            </span>
            <span class="nav-label">Monitoring</span>
          </a>

          <a class="nav-item" href="alerts.html" data-page="alerts" data-label="Alerts">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </span>
            <span class="nav-label">Alerts</span>
            <span class="nav-badge" data-for="alerts" aria-label="New alerts"></span>
          </a>

          <span class="nav-section-label">Reports &amp; Profile</span>

          <a class="nav-item" href="reports.html" data-page="reports" data-label="Reports">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </span>
            <span class="nav-label">Reports</span>
          </a>

          <a class="nav-item" href="profile.html" data-page="profile" data-label="Profile">
            <span class="nav-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <span class="nav-label">Profile</span>
          </a>
        </nav>

        <!-- Doctor profile + logout -->
        <div class="sidebar-footer">
          <a class="sidebar-doctor" href="profile.html" aria-label="View profile">
            <div class="doctor-avatar" aria-hidden="true">DS</div>
            <div class="doctor-info">
              <span class="doctor-name">Dr. Ananya Sharma</span>
              <span class="doctor-role">Doctor</span>
            </div>
          </a>
          <button class="sidebar-logout-btn" type="button" aria-label="Sign out">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sign Out</span>
          </button>
        </div>
      </aside>
      <!-- ======== /SIDEBAR ======== -->

      <!-- ======== MAIN ======== -->
      <div class="app-main">

        <!-- Topbar -->
        <header class="topbar" role="banner">
          <div class="topbar-left">
            <button
              class="topbar-menu-btn"
              id="topbar-menu-btn"
              type="button"
              aria-label="Open navigation menu"
              aria-expanded="false"
              aria-controls="app-sidebar"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
            <a class="topbar-brand" href="dashboard.html" aria-label="NEOCARE home">
              <span class="topbar-brand-icon" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                     stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              </span>
              <span class="topbar-brand-name">NEOCARE</span>
            </a>
            <h1 class="topbar-page-title">Patients</h1>
          </div>
          <div class="topbar-right">
            <button
              class="topbar-notif-btn"
              type="button"
              aria-label="View alerts"
              title="Alerts"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              <span class="notif-badge" aria-live="polite"></span>
            </button>
            <div class="topbar-doctor" aria-label="Signed in as doctor">
              <div class="topbar-doctor-avatar" aria-hidden="true">DS</div>
              <div class="topbar-doctor-info">
                <span class="topbar-doctor-name">Dr. Ananya Sharma</span>
                <span class="topbar-doctor-role">Doctor</span>
              </div>
            </div>
          </div>
        </header>

        <!-- Page content -->
        <main class="page-content" id="main-content">
          <!-- Stage 5+: Patients content will be implemented here -->
          <div class="page-placeholder">
            <div class="page-placeholder-icon" aria-hidden="true">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <p class="page-placeholder-title">Patients</p>
            <p class="page-placeholder-sub">Patient list, search, and risk filters will be implemented in Stage 5.</p>
          </div>
        </main>

      </div>
      <!-- ======== /MAIN ======== -->

    </div><!-- /.app-shell -->

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/data/dataService.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/patients.js"></script>
  </body>
</html>
